<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07060c"/>
      <stop offset="100%" style="stop-color:#1a0833"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:hsl(270,90%,70%,0.35)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Orb circle -->
  <circle cx="900" cy="315" r="200" fill="none" stroke="hsl(270,90%,70%)" stroke-width="1.5" opacity="0.2"/>
  <circle cx="900" cy="315" r="140" fill="none" stroke="hsl(270,90%,70%)" stroke-width="1" opacity="0.15"/>
  <circle cx="900" cy="315" r="100" fill="hsl(270,80%,55%)" opacity="0.12"/>
  <!-- Robot emoji area -->
  <text x="900" y="340" font-size="120" text-anchor="middle" dominant-baseline="middle">🤖</text>
  <!-- Title -->
  <text x="120" y="240" font-family="Georgia, serif" font-size="72" font-weight="700" fill="white" opacity="0.95">AI Challenge</text>
  <!-- Subtitle -->
  <text x="120" y="310" font-family="Arial, sans-serif" font-size="28" fill="hsl(270,90%,80%)" opacity="0.9">Daily AI Quiz · News · Lessons · Tutor</text>
  <!-- Feature chips -->
  <rect x="120" y="360" width="160" height="42" rx="21" fill="hsl(270,90%,70%,0.15)" stroke="hsl(270,90%,70%)" stroke-width="1" opacity="0.7"/>
  <text x="200" y="387" font-family="Arial, sans-serif" font-size="18" fill="hsl(270,90%,80%)" text-anchor="middle">🎮 Quiz Game</text>
  <rect x="300" y="360" width="160" height="42" rx="21" fill="hsl(142,68%,50%,0.12)" stroke="hsl(142,68%,50%)" stroke-width="1" opacity="0.7"/>
  <text x="380" y="387" font-family="Arial, sans-serif" font-size="18" fill="hsl(142,68%,60%)" text-anchor="middle">📰 AI News</text>
  <rect x="480" y="360" width="170" height="42" rx="21" fill="hsl(200,100%,60%,0.12)" stroke="hsl(200,100%,60%)" stroke-width="1" opacity="0.7"/>
  <text x="565" y="387" font-family="Arial, sans-serif" font-size="18" fill="hsl(200,100%,70%)" text-anchor="middle">📚 25 Lessons</text>
  <!-- URL -->
  <text x="120" y="480" font-family="monospace" font-size="22" fill="white" opacity="0.45">ai-app-builder-challenge.vercel.app</text>
  <!-- Tagline -->
  <text x="120" y="540" font-family="Georgia, serif" font-size="26" font-style="italic" fill="white" opacity="0.65">Learn by doing. Stay sharp every day.</text>
</svg>
