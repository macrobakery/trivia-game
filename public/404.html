<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · AI Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07060c;
      --surface:  #110f1c;
      --accent:   #a78bfa;
      --ink:      #e8e3f4;
      --ink-faint:#6e6a88;
      --border:   #2a2640;
      --radius:   12px;
      --green:    #4ade80;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Geist', system-ui, sans-serif;
    }

    /* Nebula background */
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18; }
    .bg-blob-1 { width: 500px; height: 500px; background: #6b3fd9; top: -200px; left: -150px; animation: drift 22s ease-in-out infinite alternate; }
    .bg-blob-2 { width: 350px; height: 350px; background: #1a6bde; bottom: -100px; right: -100px; animation: drift 28s ease-in-out infinite alternate-reverse; }
    .bg-blob-3 { width: 280px; height: 280px; background: #d93f9c; top: 40%; left: 50%; animation: drift 18s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.05); } }

    .page {
      position: relative; z-index: 1;
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      text-align: center;
      gap: 0;
    }

    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 700;
      color: transparent;
      background: linear-gradient(135deg, var(--accent), hsl(300 80% 65%));
      -webkit-background-clip: text;
      background-clip: text;
      line-height: 1;
      margin-bottom: 12px;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 0.92rem;
      color: var(--ink-faint);
      line-height: 1.65;
      max-width: 340px;
      margin-bottom: 36px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      max-width: 440px;
      width: 100%;
      margin-bottom: 28px;
    }

    .nav-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      text-decoration: none;
      color: var(--ink);
      display: flex; align-items: center; gap: 10px;
      font-size: 0.86rem; font-weight: 600;
      transition: border-color 0.2s, background 0.2s;
    }
    .nav-card:hover {
      border-color: var(--accent);
      background: hsl(270 90% 70% / 0.08);
    }
    .nav-card-icon { font-size: 1.2rem; }

    .home-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 28px;
      background: var(--accent);
      color: #0a0013;
      border: none; border-radius: 99px;
      font-size: 0.92rem; font-weight: 700;
      text-decoration: none;
      transition: filter 0.2s;
      margin-bottom: 8px;
    }
    .home-btn:hover { filter: brightness(1.1); }

    .ai-quip {
      font-size: 0.72rem;
      color: var(--ink-faint);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>
  </div>

  <div class="page">

    <div class="error-code">404</div>

    <h1>Page not found</h1>
    <p class="subtitle">
      Even the most advanced AI can't find this page. It may have been moved, deleted, or never existed.
    </p>

    <a href="/" class="home-btn">🏠 Back to Home</a>

    <div class="nav-grid">
      <a href="/lessons.html" class="nav-card">
        <span class="nav-card-icon">📚</span> Learn AI
      </a>
      <a href="/news.html" class="nav-card">
        <span class="nav-card-icon">📰</span> AI News
      </a>
      <a href="/leaderboard.html" class="nav-card">
        <span class="nav-card-icon">🏆</span> Leaderboard
      </a>
      <a href="/profile.html" class="nav-card">
        <span class="nav-card-icon">👤</span> My Profile
      </a>
      <a href="/chat.html" class="nav-card">
        <span class="nav-card-icon">🤖</span> Ask Alex
      </a>
    </div>

    <p class="ai-quip" id="quip"></p>

  </div>

  <script>
    (function(){
      const t = localStorage.getItem('aiChallenge_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();

    const quips = [
      'Error 404: Page not in training data.',
      'Neural network searched all layers. Nothing found.',
      'Gradient descent couldn\'t find this URL either.',
      'Model confidence: 0.00% that this page exists.',
      'This URL is officially out-of-distribution.',
    ];
    document.getElementById('quip').textContent =
      quips[Math.floor(Math.random() * quips.length)];
  </script>
</body>
</html>
